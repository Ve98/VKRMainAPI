version: "3"
name: iva
services:
  db:
    image: postgres:14.4
    container_name: iva-postgres
    environment:
      POSTGRES_DB: Offers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5444:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: iva-api
    container_name: iva-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db; Port=5432; Database=Offers; Username=postgres; Password=1234
    ports:
      - 5081:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    image: iva-web
    container_name: iva-web
    ports:
      - 80:80
    depends_on:
      - api

